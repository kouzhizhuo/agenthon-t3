name: T3 exact classic structural build-once long-window v2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-serial-linux-screen-v2
  cancel-in-progress: false
jobs:
  screen:
    if: github.repository == 'kouzhizhuo/agenthon-t3'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen structural harness source
        run: python3 completion1009/server_classic_structural_v2/verify_source.py
      - name: Materialize exact source overlay and original host/control oracle
        run: python3 completion1009/server_classic_structural_v2/materialize.py --archive completion1009/server_classic_structural_v2/SCREEN_PAYLOAD_v5.tar.xz --expected-sha256 cf731ac50bc2edeb171a6b3ad7f14bfc40666ed61e79448ed868bdac77e7af2f --out structural-v2-payload
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Fetch pinned official evaluator and all original references
        run: |
          mkdir -p structural-v2-evidence
          python structural-v2-payload/host/fetch_evaluation.py --out "$PWD/structural-v2-evaluation" > structural-v2-evidence/fetch-process.log 2>&1
      - name: Install pinned host evaluator only
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 pandas==2.3.3 scipy==1.18.1 pyarrow==21.0.0 jsonschema==4.23.0 jsonschema-specifications==2025.9.1 attrs==26.1.0 referencing==0.37.0 rpds-py==2026.9.1 python-dateutil==2.9.0.post0 pytz==2026.5 six==1.17.0 tzdata==2026.5
          python -m pip install --no-deps ./structural-v2-evaluation/toolkit/common ./structural-v2-evaluation/track3
          python -m pip freeze > structural-v2-evidence/EVALUATOR_FREEZE.txt
      - name: One image build each independent candidate once and inspect all source C object ELF
        run: python completion1009/server_classic_structural_v2/driver.py build --payload structural-v2-payload --evidence structural-v2-evidence --reference-root structural-v2-evaluation/references --gate-kit structural-v2-evaluation/track3
      - name: Complete finite controls separate admission witnesses then324 ordinary alternating market runs
        run: python completion1009/server_classic_structural_v2/driver.py screen --payload structural-v2-payload --evidence structural-v2-evidence --reference-root structural-v2-evaluation/references --gate-kit structural-v2-evaluation/track3
      - name: Analyze saved paired development timings only
        run: python completion1009/research/classic_structural_v2/analyze_long_window.py --raw-results structural-v2-evidence/RAW_RESULTS.json --out structural-v2-evidence/LONG_WINDOW_ANALYSIS.json
      - name: Preserve all exact source build data outputs witnesses and lifecycle evidence
        if: always()
        run: python completion1009/server_classic_structural_v2/driver.py artifact --payload structural-v2-payload --evidence structural-v2-evidence --reference-root structural-v2-evaluation/references --gate-kit structural-v2-evaluation/track3 --artifact structural-v2-artifact
      - name: Upload complete structural comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-classic-structural-v2-evidence
          path: structural-v2-artifact
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
