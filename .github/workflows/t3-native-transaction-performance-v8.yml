name: T3 native V8 five-unit performance and independent phases
on:
  workflow_dispatch:
    inputs:
      payload_sha256:
        description: Exact reviewed SCREEN_PAYLOAD_v1.tar.xz SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: t3-serial-linux-screen-v2
  cancel-in-progress: false
jobs:
  screen:
    if: github.repository == 'kouzhizhuo/agenthon-t3'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Materialize the exact reviewed source archive
        env:
          EXPECTED_PAYLOAD: ${{ inputs.payload_sha256 }}
        run: python3 completion1009/server_native_transaction_performance_v8/materialize.py --archive completion1009/server_native_transaction_performance_v8/SCREEN_PAYLOAD_v1.tar.xz --expected-sha256 "$EXPECTED_PAYLOAD" --out native-transaction-performance-v8-payload
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Fetch the pinned official host evaluator and original references
        run: |
          mkdir -p native-transaction-performance-v8-evidence
          python native-transaction-performance-v8-payload/host/fetch_evaluation.py --out "$PWD/native-transaction-performance-v8-evaluation" > native-transaction-performance-v8-evidence/fetch-process.log 2>&1
      - name: Install the pinned host evaluator
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 pandas==2.3.3 scipy==1.18.1 pyarrow==21.0.0 jsonschema==4.23.0 jsonschema-specifications==2025.9.1 attrs==26.1.0 referencing==0.37.0 rpds-py==2026.9.1 python-dateutil==2.9.0.post0 pytz==2026.5 six==1.17.0 tzdata==2026.5
          python -m pip install --no-deps ./native-transaction-performance-v8-evaluation/toolkit/common ./native-transaction-performance-v8-evaluation/track3
          python -m pip freeze > native-transaction-performance-v8-evidence/EVALUATOR_FREEZE.txt
      - name: Build actual native V8 deployment and external proof once
        run: python native-transaction-performance-v8-payload/control/controller.py build --evidence "$PWD/native-transaction-performance-v8-evidence"
      - name: Run60 serial unprofiled actual production CLI repeats
        run: python native-transaction-performance-v8-payload/control/controller.py run --evidence "$PWD/native-transaction-performance-v8-evidence" --reference-root "$PWD/native-transaction-performance-v8-evaluation/references" --gate-kit "$PWD/native-transaction-performance-v8-evaluation/track3"
      - name: Run10 independent untimed phase diagnostic containers
        run: python native-transaction-performance-v8-payload/control/controller.py diagnose --evidence "$PWD/native-transaction-performance-v8-evidence" --reference-root "$PWD/native-transaction-performance-v8-evaluation/references" --gate-kit "$PWD/native-transaction-performance-v8-evaluation/track3"
      - name: Preserve native V8 source/ELF, all outputs and failures
        if: always()
        run: python native-transaction-performance-v8-payload/control/controller.py artifact --evidence "$PWD/native-transaction-performance-v8-evidence" --artifact "$PWD/native-transaction-performance-v8-artifact"
      - name: Retain the paired Linux screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-native-transaction-performance-v8-evidence
          path: native-transaction-performance-v8-artifact
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
