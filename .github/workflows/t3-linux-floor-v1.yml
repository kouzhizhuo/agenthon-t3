name: T3 minimal Linux import and residual diagnostic v1
on:
  workflow_dispatch:
    inputs:
      payload_sha256:
        description: Exact reviewed observer-startup source payload SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: t3-serial-linux-screen-v2
  cancel-in-progress: false
jobs:
  floor:
    if: github.repository == 'kouzhizhuo/agenthon-t3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Check exact diagnostic source and existing payload hashes
        run: python3 completion1009/server_linux_floor_v1/verify_source.py
      - name: Materialize unchanged reviewed source payload
        env:
          EXPECTED_PAYLOAD: ${{ inputs.payload_sha256 }}
        run: python3 completion1009/server_observer_startup_v1/materialize.py --archive completion1009/server_observer_startup_v1/SCREEN_PAYLOAD.tar.xz --expected-sha256 "$EXPECTED_PAYLOAD" --out floor-payload
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Fetch original public inputs and current official evaluator
        run: |
          mkdir -p floor-build-evidence
          python floor-payload/host/fetch_evaluation.py --out "$PWD/floor-evaluation" > floor-build-evidence/fetch-process.log 2>&1
      - name: Install pinned host evaluator
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 pandas==2.3.3 scipy==1.18.1 pyarrow==21.0.0 jsonschema==4.23.0 jsonschema-specifications==2025.9.1 attrs==26.1.0 referencing==0.37.0 rpds-py==2026.9.1 python-dateutil==2.9.0.post0 pytz==2026.5 six==1.17.0 tzdata==2026.5
          python -m pip install --no-deps ./floor-evaluation/toolkit/common ./floor-evaluation/track3
          python -m pip freeze > floor-build-evidence/EVALUATOR_FREEZE.txt
      - name: Build both unchanged source arms once in this job
        run: python floor-payload/control/controller.py build --evidence "$PWD/floor-build-evidence"
      - name: Prepare external diagnostic wrapper only
        run: python completion1009/server_linux_floor_v1/prepare_phases_v3.py --base-probe "$PWD/floor-payload/control/entry_probe.py" --out "$PWD/floor-diagnostic-source"
      - name: Five representative units per arm with exact gates
        run: python completion1009/server_linux_floor_v1/controller.py --mode phases-five --payload "$PWD/floor-payload" --images "$PWD/floor-build-evidence/IMAGES.json" --build-evidence "$PWD/floor-build-evidence" --diagnostic-source "$PWD/floor-diagnostic-source" --reference-root "$PWD/floor-evaluation/references" --gate-kit "$PWD/floor-evaluation/track3" --evidence "$PWD/floor-run-evidence" --execute
      - name: Save diagnostic source, raw stderr, exact outputs and all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-linux-floor-diagnostic-v1-evidence
          path: |
            floor-build-evidence
            floor-run-evidence
            floor-diagnostic-source
            completion1009/server_linux_floor_v1
          retention-days: 30
          if-no-files-found: error
