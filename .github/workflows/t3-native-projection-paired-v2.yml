name: T3 native projection paired Linux screen v2
on:
  workflow_dispatch:
    inputs:
      payload_sha256:
        description: Exact reviewed SCREEN_PAYLOAD_v5.tar.xz SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: t3-serial-linux-screen-v2
  cancel-in-progress: false
jobs:
  screen:
    if: github.repository == 'kouzhizhuo/agenthon-t3'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Materialize the exact reviewed source archive
        env:
          EXPECTED_PAYLOAD: ${{ inputs.payload_sha256 }}
        run: python3 completion1009/server_native_projection_v2/materialize.py --archive completion1009/server_native_projection_v2/SCREEN_PAYLOAD_v5.tar.xz --expected-sha256 "$EXPECTED_PAYLOAD" --out projection-screen-payload
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Fetch the pinned official host evaluator and original references
        run: |
          mkdir -p projection-screen-evidence
          python projection-screen-payload/host/fetch_evaluation.py --out "$PWD/projection-screen-evaluation" > projection-screen-evidence/fetch-process.log 2>&1
      - name: Install the pinned host evaluator
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 pandas==2.3.3 scipy==1.18.1 pyarrow==21.0.0 jsonschema==4.23.0 jsonschema-specifications==2025.9.1 attrs==26.1.0 referencing==0.37.0 rpds-py==2026.9.1 python-dateutil==2.9.0.post0 pytz==2026.5 six==1.17.0 tzdata==2026.5
          python -m pip install --no-deps ./projection-screen-evaluation/toolkit/common ./projection-screen-evaluation/track3
          python -m pip freeze > projection-screen-evidence/EVALUATOR_FREEZE.txt
      - name: Build one image containing one native projection and its exact observer parent
        run: python projection-screen-payload/control/controller.py build --evidence "$PWD/projection-screen-evidence"
      - name: Run 56 finite controls, four market controls and 56 serial paired runs
        run: python projection-screen-payload/control/controller.py screen --evidence "$PWD/projection-screen-evidence" --reference-root "$PWD/projection-screen-evaluation/references" --gate-kit "$PWD/projection-screen-evaluation/track3"
      - name: Preserve actual native files, command logs and failure outputs
        if: always()
        run: python projection-screen-payload/control/controller.py artifact --evidence "$PWD/projection-screen-evidence" --archive completion1009/server_native_projection_v2/SCREEN_PAYLOAD_v5.tar.xz --artifact "$PWD/projection-screen-artifact"
      - name: Retain the paired Linux screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-native-projection-paired-v2-evidence
          path: projection-screen-artifact
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
