name: T3 exact classic delivery build verification and publication v1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-serial-linux-screen-v2
  cancel-in-progress: false
jobs:
  screen:
    if: github.repository == 'kouzhizhuo/agenthon-t3'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      packages: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed direct wrapper bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('completion1009/server_classic_delivery_v1')
          pins={'driver.py': 'd1aa05d8fe81bbb06711abbdbdcdd8592a30d83c55a7d04833cb7f11458bbdad', 'worker.py': 'be9ff110815f29cad60298a2b5c984f6a56ae6cc7db14b188d6633a9a49717d7', 'delivery_entry.py': 'f0f697185a65fcc5c77fec23adbd20c57859cc26e2ba6259e2bb6e2167a472f1', 'Dockerfile': '0a091846f3be7ef8bb18078eb171f4b8c25292c286cc1e56ae9508ac40eab00d', 'README.md': '2f562500b8cec440ec9f120e6d178cbe487385d0c6d340632e103db70dda63d6', 'LICENSE-SUBMISSION': 'ba5946c568afd98a8a77437ae44f65cd65643453d07b8bf4428da1bc1471bf65', 'SOURCE_REVIEW.json': 'bf0f0cc48341afc859bc04be52037074181760a00fa3625a7cd7e68eca464ce2'}
          for name,digest in pins.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          PY
      - name: Materialize unchanged candidate archive
        run: |
          python3 completion1009/server_classic_native_kernels_v1/materialize.py --archive completion1009/server_classic_native_kernels_v1/SCREEN_PAYLOAD_v1.tar.xz --expected-sha256 e2c0d6167ce24854d164345a14a8bef31311b6c7d28708a4e0196e8fe0002f71 --out classic-delivery-v1-scalar-payload
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Fetch the pinned official host evaluator and original references
        run: |
          mkdir -p classic-delivery-v1-evidence
          python classic-delivery-v1-scalar-payload/host/fetch_evaluation.py --out "$PWD/classic-delivery-v1-evaluation" > classic-delivery-v1-evidence/fetch-process.log 2>&1
      - name: Install the pinned host evaluator
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 pandas==2.3.3 scipy==1.18.1 pyarrow==21.0.0 jsonschema==4.23.0 jsonschema-specifications==2025.9.1 attrs==26.1.0 referencing==0.37.0 rpds-py==2026.9.1 python-dateutil==2.9.0.post0 pytz==2026.5 six==1.17.0 tzdata==2026.5
          python -m pip install --no-deps ./classic-delivery-v1-evaluation/toolkit/common ./classic-delivery-v1-evaluation/track3
          python -m pip freeze > classic-delivery-v1-evidence/EVALUATOR_FREEZE.txt
      - name: Build unchanged native image and inspect all sources
        run: python completion1009/server_classic_delivery_v1/driver.py build --payload classic-delivery-v1-scalar-payload --evidence classic-delivery-v1-evidence --reference-root classic-delivery-v1-evaluation/references --gate-kit classic-delivery-v1-evaluation/track3
      - name: Final default entry full71 and repeat stability
        run: python completion1009/server_classic_delivery_v1/driver.py screen --payload classic-delivery-v1-scalar-payload --evidence classic-delivery-v1-evidence --reference-root classic-delivery-v1-evaluation/references --gate-kit classic-delivery-v1-evaluation/track3
      - name: Push passing final image to the existing registry
        env:
          T3_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import json
          from pathlib import Path
          assert json.loads(Path('classic-delivery-v1-evidence/SUMMARY.json').read_text())['all_passed'] is True
          print(json.loads(Path('classic-delivery-v1-evidence/DELIVERY_READY.json').read_text())['image_id'],file=Path('classic-delivery-v1-evidence/IMAGE_ID.txt').open('w'))
          PYCODE
          mkdir -p "$RUNNER_TEMP/t3-delivery-registry-config"
          export DOCKER_CONFIG="$RUNNER_TEMP/t3-delivery-registry-config"
          printf '%s' "$T3_REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          T3_PUBLISH_TAG="ghcr.io/kouzhizhuo/agenthon-t3:t3-classic-delivery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "$(cat classic-delivery-v1-evidence/IMAGE_ID.txt)" "$T3_PUBLISH_TAG"
          docker push "$T3_PUBLISH_TAG" > classic-delivery-v1-evidence/image-push.log 2>&1
          docker logout ghcr.io
          unset DOCKER_CONFIG
          python completion1009/server_classic_delivery_v1/driver.py publication --payload classic-delivery-v1-scalar-payload --evidence classic-delivery-v1-evidence --reference-root classic-delivery-v1-evaluation/references --gate-kit classic-delivery-v1-evaluation/track3 --tag "$T3_PUBLISH_TAG"
      - name: Preserve final delivery evidence
        if: always()
        run: python completion1009/server_classic_delivery_v1/driver.py artifact --payload classic-delivery-v1-scalar-payload --evidence classic-delivery-v1-evidence --reference-root classic-delivery-v1-evaluation/references --gate-kit classic-delivery-v1-evaluation/track3 --artifact classic-delivery-v1-artifact
      - name: Retain full71 public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-classic-delivery-v1-evidence
          path: classic-delivery-v1-artifact
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
