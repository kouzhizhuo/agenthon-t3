name: T3 V4 exact package and native ABI evidence from inline reviewed source payload
on:
  workflow_dispatch:
    inputs:
      source_review_sha256:
        description: Exact root source review SHA256
        required: true
        type: string
      source_freeze_sha256:
        description: Exact unchanged V4 source freeze SHA256
        required: true
        type: string
permissions:
  contents: read
jobs:
  native-package:
    if: github.repository == 'kouzhizhuo/agenthon-t3'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Materialize exact inline reviewed source bytes
        env:
          EXPECTED_REVIEW: ${{ inputs.source_review_sha256 }}
          EXPECTED_FREEZE: ${{ inputs.source_freeze_sha256 }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/t3-native-package-workflow-evidence"
          cat > "$RUNNER_TEMP/t3-native-package-workflow-evidence/PAYLOAD.b64" <<'T3_V4_EXACT_PAYLOAD_B64'
          
          T3_V4_EXACT_PAYLOAD_B64
          timeout --kill-after=5s 60s python3 -I -S -B - > "$RUNNER_TEMP/t3-native-package-workflow-evidence/payload.stdout" 2> "$RUNNER_TEMP/t3-native-package-workflow-evidence/payload.stderr" <<'PY_PAYLOAD'
          import base64, hashlib, json, lzma, os, re
          from pathlib import Path, PurePosixPath
          FREEZE = {'path': '/Volumes/Alan/Nips_com/t3/research1009_quota_v2_linux_native_package_source_v4_cleanup_continuation/SOURCE_FREEZE.json', 'bytes': 27230, 'sha256': 'ba8354297a012dad83b41d7a2a5eb45dcdc69fe91752e19da295409323cfa61b'}
          REVIEW = {'path': '/Volumes/Alan/Nips_com/t3/research1009_native_package_v4_cleanup_root_source_review_v1/REVIEW.json', 'bytes': 2091, 'sha256': '2ade6c858ca5fba4c53d31396fec6d4d57a52d3c255de97f1b54f432dcfd0634'}
          if os.environ['EXPECTED_FREEZE'] != FREEZE['sha256'] or os.environ['EXPECTED_REVIEW'] != REVIEW['sha256']:
              raise ValueError('exact supplied root source review and freeze digests required')
          commit = os.environ['GITHUB_SHA']
          if re.fullmatch('[0-9a-f]{40}', commit) is None:
              raise ValueError('actual GitHub workflow source commit required')
          payload_path = Path(os.environ['RUNNER_TEMP']) / 't3-native-package-workflow-evidence/PAYLOAD.b64'
          if payload_path.is_symlink() or payload_path.resolve() != payload_path or not payload_path.is_file():
              raise ValueError('canonical inline source payload file required')
          with payload_path.open('rb') as stream:
              encoded = stream.read(242737 + 1)
          def matches(raw, length, digest):
              if len(raw) != length or hashlib.sha256(raw).hexdigest() != digest:
                  raise ValueError('exact payload bytes/hash required')
          matches(encoded, 242737, 'ce6e4e8ded12f267a8d229b45ec6101cc4e018ac6f7fda409e60b5c0861ae7ea')
          if not encoded.endswith(b'\n') or b'\n' in encoded[:-1] or b'\r' in encoded:
              raise ValueError('exact one-LF base64 payload required')
          packed = base64.b64decode(encoded[:-1], validate=True)
          if base64.b64encode(packed) != encoded[:-1]:
              raise ValueError('canonical base64 source payload required')
          matches(packed, 182052, 'f257d4db70160fad75ee277b5ab30ae93e39b6e32ccf2cc7a9e7fa1c2d341b33')
          decoder = lzma.LZMADecompressor(format=lzma.FORMAT_XZ, memlimit=64 * 1024 ** 2)
          raw = decoder.decompress(packed, max_length=906224 + 1)
          if not decoder.eof or decoder.unused_data:
              raise ValueError('one bounded complete XZ archive required')
          matches(raw, 906224, '7b26108a226c99d2a9b1c74f4330b2772753ef140cd1067925d1e69ec1b72eeb')
          def strict(raw):
              def pairs(items):
                  value = {}
                  for key, item in items:
                      if key in value:
                          raise ValueError('duplicate source JSON field')
                      value[key] = item
                  return value
              def bad(value):
                  raise ValueError('nonfinite source JSON ' + value)
              return json.loads(raw, object_pairs_hook=pairs, parse_constant=bad)
          body = strict(raw)
          if (body.get('schema') != 't3-v4-exact-reviewed-source-byte-archive-v1'
                  or body.get('source_freeze') != FREEZE or body.get('source_review') != REVIEW
                  or body.get('original_frozen_members') != 92 or body.get('total_members') != 94
                  or body.get('candidate_execution') != 0 or body.get('submission') is not False
                  or set(body['files']) != set(body['inventory']) or len(body['files']) != 94):
              raise ValueError('exact closed reviewed source archive required')
          members = {}
          for name, encoded_member in body['files'].items():
              relative = PurePosixPath(name)
              if (not relative.parts or relative.is_absolute() or str(relative) != name or '..' in relative.parts
                      or any(part.startswith('._') or part == '__pycache__' for part in relative.parts)
                      or relative.suffix == '.pyc'):
                  raise ValueError('canonical unique ordinary source member required')
              member = base64.b64decode(encoded_member, validate=True)
              if base64.b64encode(member).decode('ascii') != encoded_member or len(member) > 128 * 1024 ** 2:
                  raise ValueError('canonical bounded base64 source member required')
              expected = body['inventory'][name]
              matches(member, expected['bytes'], expected['sha256'])
              members[name] = member
          matches(members['SOURCE_FREEZE.json'], FREEZE['bytes'], FREEZE['sha256'])
          matches(members['SOURCE_REVIEW.json'], REVIEW['bytes'], REVIEW['sha256'])
          freeze, review = strict(members['SOURCE_FREEZE.json']), strict(members['SOURCE_REVIEW.json'])
          if (not review.get('status', '').startswith('PASS') or review.get('source_authorship_overlap') is not False
                  or review.get('source_freeze') != FREEZE or freeze.get('source_root') != str(Path(FREEZE['path']).parent)
                  or len(freeze['files']) != 92):
              raise ValueError('exact root disjoint source review required')
          origin = PurePosixPath(freeze['source_root'])
          declared = set()
          for row in freeze['files']:
              relative = PurePosixPath(row['path']).relative_to(origin).as_posix()
              if relative in declared or relative not in members:
                  raise ValueError('exact original source member projection required')
              matches(members[relative], row['bytes'], row['sha256'])
              declared.add(relative)
          if declared != set(members) - {'SOURCE_FREEZE.json', 'SOURCE_REVIEW.json'}:
              raise ValueError('closed original92 inventory differs')
          root = Path.cwd() / 'verification/t3-native-package'
          if root.exists() or root.is_symlink() or root.resolve() != root:
              raise ValueError('fresh canonical portable source root required')
          root.mkdir(parents=True, mode=0o755)
          for name, member in sorted(members.items()):
              destination = root.joinpath(*PurePosixPath(name).parts)
              destination.parent.mkdir(parents=True, exist_ok=True)
              with destination.open('xb') as stream:
                  stream.write(member)
              destination.chmod(0o644)
          for directory in [root] + [path for path in root.rglob('*') if path.is_dir()]:
              directory.chmod(0o755)
          evidence = Path(os.environ['RUNNER_TEMP']) / 't3-native-package-workflow-evidence'
          (evidence / 'PAYLOAD_RECEIPT.json').write_text(json.dumps({'status': 'EXACT_REVIEWED_SOURCE_PAYLOAD_MATERIALIZED_ONLY', 'workflow_source_commit': commit, 'payload_source': 'inline workflow heredoc', 'encoded_bytes': len(encoded), 'encoded_sha256': hashlib.sha256(encoded).hexdigest(), 'source_freeze': FREEZE, 'source_review': REVIEW, 'members': 94, 'original_frozen_members': 92, 'candidate_execution': 0, 'submission': False}, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'status': 'EXACT_SOURCE_BYTES_MATERIALIZED_ONLY', 'source': str(root), 'members': 94, 'candidate_execution': 0}, sort_keys=True))
          PY_PAYLOAD
      - name: Stage original exact source with portable readable permissions
        env:
          EXPECTED_REVIEW: ${{ inputs.source_review_sha256 }}
          EXPECTED_FREEZE: ${{ inputs.source_freeze_sha256 }}
        run: |
          set -euo pipefail
          python3 -I -S -B verification/t3-native-package/prepare_workflow_once.py --freeze-sha256 "$EXPECTED_FREEZE" --review-sha256 "$EXPECTED_REVIEW" --out "$RUNNER_TEMP/t3-native-package" > "$RUNNER_TEMP/t3-native-package-workflow-evidence/stage.stdout" 2> "$RUNNER_TEMP/t3-native-package-workflow-evidence/stage.stderr"
      - name: Acquire exact public wheel and build compiler image once
        run: |
          set -euo pipefail
          python3 -I -S -B "$RUNNER_TEMP/t3-native-package/source/run_compiler_once.py" --work "$RUNNER_TEMP/t3-native-package" > "$RUNNER_TEMP/t3-native-package-workflow-evidence/compiler.stdout" 2> "$RUNNER_TEMP/t3-native-package-workflow-evidence/compiler.stderr"
      - name: Admit actual compiler metadata under exact reviewed source policy
        run: |
          set -euo pipefail
          python3 -I -S -B "$RUNNER_TEMP/t3-native-package/source/prepare_package_gate_once.py" --work "$RUNNER_TEMP/t3-native-package" > "$RUNNER_TEMP/t3-native-package-workflow-evidence/metadata.stdout" 2> "$RUNNER_TEMP/t3-native-package-workflow-evidence/metadata.stderr"
      - name: Build exact package and run native ABI controls once
        run: |
          set -euo pipefail
          GATE_SHA256="$(python3 -I -S -B "$RUNNER_TEMP/t3-native-package/source/gate_digest.py" "$RUNNER_TEMP/t3-native-package/RUN_GATE.json")"
          python3 -I -S -B "$RUNNER_TEMP/t3-native-package/source/run_package_linux_once.py" --gate "$RUNNER_TEMP/t3-native-package/RUN_GATE.json" --gate-sha256 "$GATE_SHA256" --out "$RUNNER_TEMP/t3-native-package/evidence" > "$RUNNER_TEMP/t3-native-package-workflow-evidence/package.stdout" 2> "$RUNNER_TEMP/t3-native-package-workflow-evidence/package.stderr"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t3-native-package-v4-ABI-evidence
          path: |
            ${{ runner.temp }}/t3-native-package-workflow-evidence
            ${{ runner.temp }}/t3-native-package/WORKFLOW_CONSUMED.json
            ${{ runner.temp }}/t3-native-package/SOURCE_REVIEW.json
            ${{ runner.temp }}/t3-native-package/SOURCE_FREEZE_PIN.json
            ${{ runner.temp }}/t3-native-package/COMPILER_IMAGE_ID.txt
            ${{ runner.temp }}/t3-native-package/COMPILER_METADATA_ADMISSION.json
            ${{ runner.temp }}/t3-native-package/RUN_GATE.json
            ${{ runner.temp }}/t3-native-package/compiler-build
            ${{ runner.temp }}/t3-native-package/compiler-admission
            ${{ runner.temp }}/t3-native-package/evidence
          retention-days: 1
          if-no-files-found: warn
