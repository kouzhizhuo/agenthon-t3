name: T3 exact integer event heap versus classic parent v1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-serial-linux-screen-v2
  cancel-in-progress: false
jobs:
  screen:
    if: github.repository == 'kouzhizhuo/agenthon-t3'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed direct wrapper bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('completion1009/server_native_integer_heap_v1')
          pins={'driver.py': 'ea46e0f8489f445a1dd17e201610085b24e45b959639e153c7737eb822176608', 'worker.py': 'be9ff110815f29cad60298a2b5c984f6a56ae6cc7db14b188d6633a9a49717d7', 'README.md': '7fbd79dd8d5c72f48262a1d5d0912915b810b07d94d78b703245d5d6a7d7d9da', 'SOURCE_REVIEW.json': '79c61b0a083c7277e385e9a3d22d35cc047874a664477898331d5d04fc919f14', 'materialize.py': '1becd43b5fa775327326616358a8e2d92f52dc3c3cfa996618e06ead8bd1e739', 'common.py': '4e71c2125f6c99d6cde8038bccc4dbcf5354b4a2337328db1edea3f4357c715b'}
          for name,digest in pins.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest, name
          PY
      - name: Materialize both unchanged frozen archives
        run: |
          python3 completion1009/server_classic_native_kernels_v1/materialize.py --archive completion1009/server_classic_native_kernels_v1/SCREEN_PAYLOAD_v1.tar.xz --expected-sha256 e2c0d6167ce24854d164345a14a8bef31311b6c7d28708a4e0196e8fe0002f71 --out integer-heap-v1-incumbent-payload
          python3 completion1009/server_native_integer_heap_v1/materialize.py --archive completion1009/server_native_integer_heap_v1/SCREEN_PAYLOAD_v1.tar.xz --expected-sha256 7eb05a16daa473b456d9e67e9bf0c70580a70322bbf25a6be778ec32522ec16c --out integer-heap-v1-scalar-payload
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Fetch the pinned official host evaluator and original references
        run: |
          mkdir -p integer-heap-v1-evidence
          python integer-heap-v1-scalar-payload/host/fetch_evaluation.py --out "$PWD/integer-heap-v1-evaluation" > integer-heap-v1-evidence/fetch-process.log 2>&1
      - name: Install the pinned host evaluator
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 pandas==2.3.3 scipy==1.18.1 pyarrow==21.0.0 jsonschema==4.23.0 jsonschema-specifications==2025.9.1 attrs==26.1.0 referencing==0.37.0 rpds-py==2026.9.1 python-dateutil==2.9.0.post0 pytz==2026.5 six==1.17.0 tzdata==2026.5
          python -m pip install --no-deps ./integer-heap-v1-evaluation/toolkit/common ./integer-heap-v1-evaluation/track3
          python -m pip freeze > integer-heap-v1-evidence/EVALUATOR_FREEZE.txt
      - name: Build both original native images and inspect all sources
        run: python completion1009/server_native_integer_heap_v1/driver.py build --incumbent-payload integer-heap-v1-incumbent-payload --scalar-payload integer-heap-v1-scalar-payload --evidence integer-heap-v1-evidence --reference-root integer-heap-v1-evaluation/references --gate-kit integer-heap-v1-evaluation/track3
      - name: Original complete controls then50alternating exact market runs
        run: python completion1009/server_native_integer_heap_v1/driver.py screen --incumbent-payload integer-heap-v1-incumbent-payload --scalar-payload integer-heap-v1-scalar-payload --evidence integer-heap-v1-evidence --reference-root integer-heap-v1-evaluation/references --gate-kit integer-heap-v1-evaluation/track3
      - name: Preserve both frozen sources all outputs and actual logs
        if: always()
        run: python completion1009/server_native_integer_heap_v1/driver.py artifact --incumbent-payload integer-heap-v1-incumbent-payload --scalar-payload integer-heap-v1-scalar-payload --evidence integer-heap-v1-evidence --reference-root integer-heap-v1-evaluation/references --gate-kit integer-heap-v1-evaluation/track3 --artifact integer-heap-v1-artifact
      - name: Retain direct comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-native-integer-heap-v1-evidence
          path: integer-heap-v1-artifact
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
