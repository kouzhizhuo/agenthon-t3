name: T3 native row-ledger versus classic parent v1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-serial-linux-screen-v2
  cancel-in-progress: false
jobs:
  screen:
    if: github.repository == 'kouzhizhuo/agenthon-t3'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed direct wrapper bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('completion1009/server_native_row_ledger_v1')
          pins={'driver.py': 'a7a4b1c6619d4d3f77413a180a8b7a278ffa24c76ffec57f4c7021792acba6f3', 'worker.py': 'be9ff110815f29cad60298a2b5c984f6a56ae6cc7db14b188d6633a9a49717d7', 'README.md': '5dcf91b96d2ba412de29b09a8bdca372764caa99c4b652fcfb32954b2b8408c7', 'SOURCE_REVIEW.json': '752e844fd1e1b6e9105f3cd7faf95b5581693b0286ef507818f88ffcab61fa18', 'materialize.py': '1becd43b5fa775327326616358a8e2d92f52dc3c3cfa996618e06ead8bd1e739', 'common.py': 'd063fad3d9236bf100c68da6f980a962adb2b2a666db6bbcd91ccfc7190dba78'}
          for name,digest in pins.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest, name
          PY
      - name: Materialize both unchanged frozen archives
        run: |
          python3 completion1009/server_classic_native_kernels_v1/materialize.py --archive completion1009/server_classic_native_kernels_v1/SCREEN_PAYLOAD_v1.tar.xz --expected-sha256 e2c0d6167ce24854d164345a14a8bef31311b6c7d28708a4e0196e8fe0002f71 --out row-ledger-v1-incumbent-payload
          python3 completion1009/server_native_row_ledger_v1/materialize.py --archive completion1009/server_native_row_ledger_v1/SCREEN_PAYLOAD_v1.tar.xz --expected-sha256 2a6a99f313d7ba44840147563ba7cc550c3220fa245a9dd6748391df9bc1e687 --out row-ledger-v1-scalar-payload
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Fetch the pinned official host evaluator and original references
        run: |
          mkdir -p row-ledger-v1-evidence
          python row-ledger-v1-scalar-payload/host/fetch_evaluation.py --out "$PWD/row-ledger-v1-evaluation" > row-ledger-v1-evidence/fetch-process.log 2>&1
      - name: Install the pinned host evaluator
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 pandas==2.3.3 scipy==1.18.1 pyarrow==21.0.0 jsonschema==4.23.0 jsonschema-specifications==2025.9.1 attrs==26.1.0 referencing==0.37.0 rpds-py==2026.9.1 python-dateutil==2.9.0.post0 pytz==2026.5 six==1.17.0 tzdata==2026.5
          python -m pip install --no-deps ./row-ledger-v1-evaluation/toolkit/common ./row-ledger-v1-evaluation/track3
          python -m pip freeze > row-ledger-v1-evidence/EVALUATOR_FREEZE.txt
      - name: Build both original native images and inspect all sources
        run: python completion1009/server_native_row_ledger_v1/driver.py build --incumbent-payload row-ledger-v1-incumbent-payload --scalar-payload row-ledger-v1-scalar-payload --evidence row-ledger-v1-evidence --reference-root row-ledger-v1-evaluation/references --gate-kit row-ledger-v1-evaluation/track3
      - name: Original complete controls then180alternating exact market runs
        run: python completion1009/server_native_row_ledger_v1/driver.py screen --incumbent-payload row-ledger-v1-incumbent-payload --scalar-payload row-ledger-v1-scalar-payload --evidence row-ledger-v1-evidence --reference-root row-ledger-v1-evaluation/references --gate-kit row-ledger-v1-evaluation/track3
      - name: Preserve both frozen sources all outputs and actual logs
        if: always()
        run: python completion1009/server_native_row_ledger_v1/driver.py artifact --incumbent-payload row-ledger-v1-incumbent-payload --scalar-payload row-ledger-v1-scalar-payload --evidence row-ledger-v1-evidence --reference-root row-ledger-v1-evaluation/references --gate-kit row-ledger-v1-evaluation/track3 --artifact row-ledger-v1-artifact
      - name: Retain direct comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-native-row-ledger-v1-evidence
          path: row-ledger-v1-artifact
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
