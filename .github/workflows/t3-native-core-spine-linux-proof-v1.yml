name: T3 finite native core spine Linux proof v1
on:
  workflow_dispatch:
    inputs:
      payload_sha256:
        description: Exact reviewed NATIVE_PROOF_PAYLOAD.tar.xz SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: t3-serial-linux-screen-v2
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'kouzhizhuo/agenthon-t3'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Materialize the exact reviewed source archive
        env:
          EXPECTED_PAYLOAD: ${{ inputs.payload_sha256 }}
        run: python3 completion1009/server_native_spine_v1/materialize.py --archive completion1009/server_native_spine_v1/NATIVE_PROOF_PAYLOAD.tar.xz --expected-sha256 "$EXPECTED_PAYLOAD" --out native-proof-payload
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Fetch the pinned official host evaluator and original references
        run: |
          mkdir -p native-proof-evidence
          python native-proof-payload/host/fetch_evaluation.py --out "$PWD/native-proof-evaluation" > native-proof-evidence/fetch-process.log 2>&1
      - name: Install the pinned host evaluator
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 pandas==2.3.3 scipy==1.18.1 pyarrow==21.0.0 jsonschema==4.23.0 jsonschema-specifications==2025.9.1 attrs==26.1.0 referencing==0.37.0 rpds-py==2026.9.1 python-dateutil==2.9.0.post0 pytz==2026.5 six==1.17.0 tzdata==2026.5
          python -m pip install --no-deps ./native-proof-evaluation/toolkit/common ./native-proof-evaluation/track3
          python -m pip freeze > native-proof-evidence/EVALUATOR_FREEZE.txt
      - name: One source-preflight and receipt-bound native build
        run: python native-proof-payload/control/controller.py build --evidence "$PWD/native-proof-evidence"
      - name: Finite controls, four original single units and two-member batch isolation
        run: python native-proof-payload/control/controller.py prove --evidence "$PWD/native-proof-evidence" --reference-root "$PWD/native-proof-evaluation/references" --gate-kit "$PWD/native-proof-evaluation/track3"
      - name: Preserve actual native files, all command logs and emitted outputs
        if: always()
        run: python native-proof-payload/control/controller.py artifact --evidence "$PWD/native-proof-evidence" --archive completion1009/server_native_spine_v1/NATIVE_PROOF_PAYLOAD.tar.xz --artifact "$PWD/native-proof-artifact"
      - name: Retain the finite Linux proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-native-core-spine-linux-proof-v1-evidence
          path: native-proof-artifact
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
