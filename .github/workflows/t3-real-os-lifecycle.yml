name: T3 quota V2 real Linux OS lifecycle controls
on:
  workflow_dispatch:
    inputs:
      independent_review_sha256:
        description: Root verified disjoint workflow review digest
        type: string
        required: true
permissions:
  contents: read
jobs:
  finite-os:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_IMAGE: docker.io/library/python@sha256:8fb4cfa1a2616d7b8e0c2175cc6ad68f5729c34ea8488c0b360d2934b7be9024
      WORKFLOW_REVIEW_SHA256: ${{ inputs.independent_review_sha256 }}
    steps:
      - name: Materialize exact frozen source payload
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY_BUNDLE'
          import base64, hashlib, json, os, re, zlib
          from pathlib import Path, PurePosixPath
          assert re.fullmatch('[0-9a-f]{64}', os.environ['WORKFLOW_REVIEW_SHA256'])
          packed = base64.b64decode('', validate=True)
          assert len(packed) == 41878 and hashlib.sha256(packed).hexdigest() == '62a2cf4bcd4bff5ffd7e9c7fa8b81b531ec65e5ed3c7d1ccc07ecbe2a93a20ab'
          decoder = zlib.decompressobj()
          raw = decoder.decompress(packed, 154931 + 1)
          assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
          assert len(raw) == 154931 and hashlib.sha256(raw).hexdigest() == 'eb1628e0bf6d2c0897ee0e34aec5f5eaa4b71c34291bcae3ba1c6b016fbb4a2d'
          def unique(items):
              result = {}
              for key, value in items:
                  if key in result: raise ValueError('duplicate payload key')
                  result[key] = value
              return result
          body = json.loads(raw, object_pairs_hook=unique)
          assert body['schema'] == 't3-os-only-exact-linux-payload-v1'
          assert set(body['files']) == set(body['inventory']) and len(body['files']) == 26
          root = Path('bundle'); root.mkdir()
          for name, text in body['files'].items():
              relative = PurePosixPath(name)
              assert not relative.is_absolute() and str(relative) == name and '..' not in relative.parts
              assert not any(part.startswith('._') for part in relative.parts)
              member = text.encode('utf-8'); row = body['inventory'][name]
              assert len(member) == row['bytes'] and hashlib.sha256(member).hexdigest() == row['sha256']
              path = root.joinpath(*relative.parts); path.parent.mkdir(parents=True, exist_ok=True)
              with path.open('xb') as stream: stream.write(member)
          Path('WORKFLOW_REVIEW_SHA256.txt').write_text(os.environ['WORKFLOW_REVIEW_SHA256'] + '\n')
          PY_BUNDLE
      - name: Build fixed immutable Linux OS image
        run: |
          set -euo pipefail
          mkdir anonymous-docker-config
          export DOCKER_CONFIG="$PWD/anonymous-docker-config"
          timeout --kill-after=10s 180s docker pull "$BASE_IMAGE" > base-pull.txt
          docker image inspect "$BASE_IMAGE" > base-image-inspect.json
          timeout --kill-after=10s 180s docker build --network none --platform linux/amd64 --pull=false --tag t3-real-os:reviewed bundle > build.txt
          docker image inspect t3-real-os:reviewed > os-image-inspect.json
          python3 -I -S -B - <<'PY_ID'
          import json
          from pathlib import Path
          row = json.loads(Path('os-image-inspect.json').read_bytes())[0]
          assert row['Architecture'] == 'amd64' and row['Os'] == 'linux'
          assert row['Config']['User'] == '65534:65534'
          assert row['Config']['Entrypoint'] == ['/usr/local/bin/python', '-I', '-S', '-B', '/verification/container_entry.py']
          Path('OS_IMAGE_ID.txt').write_text(row['Id'] + '\n')
          PY_ID
      - name: Run full ten OS controls once with external containment
        run: |
          set -euo pipefail
          IMAGE_ID="$(cat OS_IMAGE_ID.txt)"
          OS_NAME="t3-real-os-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir os-output
          chmod 0777 os-output
          cleanup_os() {
            timeout --kill-after=5s 15s docker inspect "$OS_NAME" > os-container-final-inspect.json 2> os-container-final-inspect.stderr || true
            timeout --kill-after=5s 20s docker rm -f "$OS_NAME" > os-container-removal.txt 2>&1 || true
            if docker container ls -a --format '{{.Names}}' | python3 -I -S -B -c 'import sys; assert sys.argv[1] not in sys.stdin.read().splitlines()' "$OS_NAME"; then
              printf '%s\n' 'exact container observed absent after cleanup' > os-container-absent.txt
            fi
          }
          trap cleanup_os EXIT
          docker create --name "$OS_NAME" --pull never --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus 2 --memory 512m --memory-swap 512m --pids-limit 16 -v "$PWD/os-output:/output:rw" "$IMAGE_ID" > os-container-id.txt
          timeout --kill-after=5s 120s docker start -a "$OS_NAME" > os-container-stdout.txt 2> os-container-stderr.txt
          docker inspect "$OS_NAME" > os-container-inspect.json
          sudo python3 -I -S -B "$PWD/bundle/verification/prepare_evidence.py" --uid "$(id -u)" --gid "$(id -g)" --phase success --container-name "$OS_NAME"
          python3 -I -S -B bundle/verification/verify_result.py --output os-output --container os-container-inspect.json --image-id "$IMAGE_ID" > os-summary.json
          cat os-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve partial evidence ownership after settlement
        if: always()
        run: |
          set -euo pipefail
          if [ -e os-output ]; then
            sudo python3 -I -S -B "$PWD/bundle/verification/prepare_evidence.py" --uid "$(id -u)" --gid "$(id -g)" --phase always --container-name "t3-real-os-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
      - name: Preserve exact source and all OS receipts including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t3-real-os-lifecycle-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            bundle
            WORKFLOW_REVIEW_SHA256.txt
            base-pull.txt
            base-image-inspect.json
            build.txt
            os-image-inspect.json
            OS_IMAGE_ID.txt
            os-container-*.txt
            os-container-*.json
            os-container-*.stderr
            os-output
            os-evidence-*.json
            os-summary.json
