name: T3 production source and native exact Linux verification
on:
  workflow_dispatch:
    inputs:
      payload_sha256:
        description: Exact reviewed production and evaluator payload SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: t3-completion-production-linux
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.repository == 'kouzhizhuo/agenthon-t3'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      packages: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Materialize frozen production and evaluator source
        env:
          EXPECTED_PAYLOAD: ${{ inputs.payload_sha256 }}
