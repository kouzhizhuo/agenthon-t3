          python-version: '3.13.7'
      - name: Fetch fixed current official task and toolkit plus validated public references
        run: python completion/fetch_evaluation.py --out "$PWD/evaluation" > evidence/fetch-process.log 2>&1
      - name: Install pinned evaluator dependencies and official packages
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 pandas==2.3.3 scipy==1.18.1 pyarrow==21.0.0 jsonschema==4.23.0 jsonschema-specifications==2025.9.1 attrs==26.1.0 referencing==0.37.0 rpds-py==2026.9.1 python-dateutil==2.9.0.post0 pytz==2026.5 six==1.17.0 tzdata==2026.5
          python -m pip install --no-deps ./evaluation/toolkit/common ./evaluation/track3
          python -m pip freeze > evidence/EVALUATOR_FREEZE.txt
          cp evaluation/FETCH_RECEIPT.json evidence/FETCH_RECEIPT.json
      - name: Build both actual Linux production images and save native ABI provenance
        run: python completion/run_linux_workflow.py build --evidence "$PWD/evidence" --evaluation "$PWD/evaluation"
      - name: Check actual source and native imports dataclasses Enum ID and both verbs
        run: python completion/run_linux_workflow.py controls --evidence "$PWD/evidence" --evaluation "$PWD/evaluation"
      - name: Verify both images against full 71 unit roster and 60 isolated markets with unchanged official developer gates
        run: python completion/run_linux_workflow.py full --evidence "$PWD/evidence" --evaluation "$PWD/evaluation"
      - name: Five paired timing repeats and one warmup on fixed five representative units
        run: python completion/run_linux_workflow.py pilot --evidence "$PWD/evidence" --evaluation "$PWD/evaluation"
      - name: Select from complete exact passing evidence
        run: python completion/run_linux_workflow.py select --evidence "$PWD/evidence" --evaluation "$PWD/evaluation"
      - name: Publish only the selected verified image to existing public T3 package
        env:
          T3_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/t3-publish-docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$T3_REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          T3_SELECTED_ID=$(python -c 'import json;print(json.load(open("evidence/SELECTED_IMAGE.json"))["selected_image_id"])')
          T3_PUBLISH_TAG="ghcr.io/kouzhizhuo/agenthon-t3:t3-completion-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "$T3_SELECTED_ID" "$T3_PUBLISH_TAG"
          docker push "$T3_PUBLISH_TAG" > evidence/image-push.log 2>&1
          docker image inspect "$T3_PUBLISH_TAG" > evidence/PUBLISHED_IMAGE.json
          docker logout ghcr.io
          python - <<'PYCODE'
          import json,pathlib
          image=json.loads(pathlib.Path('evidence/PUBLISHED_IMAGE.json').read_text())[0]
          refs=[r for r in image['RepoDigests'] if r.startswith('ghcr.io/kouzhizhuo/agenthon-t3@sha256:')]
          if len(refs)!=1:raise ValueError('one pushed immutable repository digest required')
          pathlib.Path('evidence/PUBLISHED_REFERENCE.txt').write_text(refs[0]+'\n')
          PYCODE
      - name: Prove anonymous registry access and seal current official development descriptor
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$PWD/evidence/anonymous-config"
          T3_PUBLISHED_REF=$(cat evidence/PUBLISHED_REFERENCE.txt)
          docker manifest inspect "$T3_PUBLISHED_REF" > evidence/ANONYMOUS_MANIFEST.json
          docker pull --platform linux/amd64 "$T3_PUBLISHED_REF" > evidence/anonymous-pull.log 2>&1
          T3_PUBLISHED_DIGEST="${T3_PUBLISHED_REF##*@}"
          python completion/prepare_descriptor.py --digest "$T3_PUBLISHED_DIGEST" --out evidence/submission.json > evidence/DESCRIPTOR_VALIDATION.txt
      - name: Retain actual results and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-completion-production-linux-evidence
          path: evidence
          retention-days: 7
          if-no-files-found: error
