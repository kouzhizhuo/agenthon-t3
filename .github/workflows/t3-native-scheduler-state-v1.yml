name: T3 typed scheduler state versus classic parent v1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-serial-linux-screen-v2
  cancel-in-progress: false
jobs:
  screen:
    if: github.repository == 'kouzhizhuo/agenthon-t3'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed direct wrapper bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('completion1009/server_native_scheduler_state_v1')
          pins={'driver.py': 'd6f1f466363eb6ed211d5927f9a84a986f27d815dacce99b5a3eb9c4cb8f9b21', 'worker.py': 'be9ff110815f29cad60298a2b5c984f6a56ae6cc7db14b188d6633a9a49717d7', 'README.md': 'ba6ac85dfbf9c5abba7b1f1f2416f010500711a0c810fd957fbc634a9932e432', 'SOURCE_REVIEW.json': '4d1b333df0a0720e6f3641508f9246bcc776f4b09addc37b786a8db733e30cb0', 'materialize.py': '1becd43b5fa775327326616358a8e2d92f52dc3c3cfa996618e06ead8bd1e739', 'common.py': '5a30bd2063fdfbf7c67135dac8542000071f13ae5e59ddb754f5276cc57b1618'}
          for name,digest in pins.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest, name
          PY
      - name: Materialize both unchanged frozen archives
        run: |
          python3 completion1009/server_classic_native_kernels_v1/materialize.py --archive completion1009/server_classic_native_kernels_v1/SCREEN_PAYLOAD_v1.tar.xz --expected-sha256 e2c0d6167ce24854d164345a14a8bef31311b6c7d28708a4e0196e8fe0002f71 --out scheduler-state-v1-incumbent-payload
          python3 completion1009/server_native_scheduler_state_v1/materialize.py --archive completion1009/server_native_scheduler_state_v1/SCREEN_PAYLOAD_v1.tar.xz --expected-sha256 4fa982f13dd2672a7017c0b5b382974c46d3e7a480f2a66cff5a7c34aea8052a --out scheduler-state-v1-scalar-payload
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Fetch the pinned official host evaluator and original references
        run: |
          mkdir -p scheduler-state-v1-evidence
          python scheduler-state-v1-scalar-payload/host/fetch_evaluation.py --out "$PWD/scheduler-state-v1-evaluation" > scheduler-state-v1-evidence/fetch-process.log 2>&1
      - name: Install the pinned host evaluator
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 pandas==2.3.3 scipy==1.18.1 pyarrow==21.0.0 jsonschema==4.23.0 jsonschema-specifications==2025.9.1 attrs==26.1.0 referencing==0.37.0 rpds-py==2026.9.1 python-dateutil==2.9.0.post0 pytz==2026.5 six==1.17.0 tzdata==2026.5
          python -m pip install --no-deps ./scheduler-state-v1-evaluation/toolkit/common ./scheduler-state-v1-evaluation/track3
          python -m pip freeze > scheduler-state-v1-evidence/EVALUATOR_FREEZE.txt
      - name: Build both original native images and inspect all sources
        run: python completion1009/server_native_scheduler_state_v1/driver.py build --incumbent-payload scheduler-state-v1-incumbent-payload --scalar-payload scheduler-state-v1-scalar-payload --evidence scheduler-state-v1-evidence --reference-root scheduler-state-v1-evaluation/references --gate-kit scheduler-state-v1-evaluation/track3
      - name: Original complete controls then50alternating exact market runs
        run: python completion1009/server_native_scheduler_state_v1/driver.py screen --incumbent-payload scheduler-state-v1-incumbent-payload --scalar-payload scheduler-state-v1-scalar-payload --evidence scheduler-state-v1-evidence --reference-root scheduler-state-v1-evaluation/references --gate-kit scheduler-state-v1-evaluation/track3
      - name: Preserve both frozen sources all outputs and actual logs
        if: always()
        run: python completion1009/server_native_scheduler_state_v1/driver.py artifact --incumbent-payload scheduler-state-v1-incumbent-payload --scalar-payload scheduler-state-v1-scalar-payload --evidence scheduler-state-v1-evidence --reference-root scheduler-state-v1-evaluation/references --gate-kit scheduler-state-v1-evaluation/track3 --artifact scheduler-state-v1-artifact
      - name: Retain direct comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-native-scheduler-state-v1-evidence
          path: scheduler-state-v1-artifact
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
